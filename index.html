<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="py-20 min-h-screen bg-gray-50">
      <div
        class="product-gallery-layer h-screen bg-black/60 fixed top-0 left-0 z-1 w-full flex items-center justify-center opacity-0 pointer-events-none"
      >
        <div
          class="close-gallery w-14 h-14 bg-white flex items-center justify-center rounded-full absolute top-10 right-10 text-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-x"
            viewBox="0 0 16 16"
          >
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
            />
          </svg>
        </div>
        <div
          class="product-gallery-arrows absolute w-full flex justify-between px-10"
        >
          <div
            class="arrow arrow-left w-14 h-14 bg-white flex items-center justify-center rounded-full"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              fill="currentColor"
              class="bi bi-arrow-left"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"
              />
            </svg>
          </div>
          <div
            class="arrow arrow-right w-16 h-16 bg-white flex items-center justify-center rounded-full"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-arrow-right"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"
              />
            </svg>
          </div>
        </div>
        <div
          class="product-gallery-image w-[80%] h-[80%] bg-white p-4 mx-auto rounded-2xl overflow-hidden"
        >
          <img src="" alt="" class="w-full h-full object-contain" />
        </div>
      </div>
      <div class="container mx-auto px-20">
        <div class="product-section-header text-center mb-4">
          <h2 class="text-2xl uppercase font-medium mb-1.5">Products</h2>
          <p class="text-sm text-gray-400">
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. Incidunt
            eveniet, tempore debitis expedita aliquid obcaecati ad quas sint
            necessitatibus doloremque.
          </p>
        </div>
        <div
          class="product-container grid md:grid-cols-2 lg:grid-cols-3 grid-cols-1 md:gap-10 lg:gap-12 gap-4 mt-10"
        ></div>
      </div>
    </section>

    <script src="./js/index.js"></script>
  </body>
</html>
